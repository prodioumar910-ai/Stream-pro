<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - StreamView</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
        body { 
            background-color: #050505;
            color: #FFFFFF; 
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }
        .bg-cinematic {
            background-image: url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=2000&q=80');
            background-size: cover;
            background-position: center;
        }
        .glass-panel {
            background: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }
        /* Custom Input Autofill styling to keep it dark */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #1A1A1A inset !important;
            -webkit-text-fill-color: white !important;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        brand: '#00BFFF',
                    }
                }
            }
        }
    </script>
</head>
<body class="selection:bg-brand/30 relative h-screen w-screen flex items-center justify-center">

    <!-- Background Image with Overlay -->
    <div class="absolute inset-0 bg-cinematic z-0"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-black/80 to-[#050505] z-0"></div>

    <!-- Top Left Logo -->
    <a href="index.html" class="absolute top-6 left-6 z-20 flex items-center gap-2 hover:opacity-80 transition-opacity">
        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-brand to-blue-400 flex items-center justify-center shadow-[0_0_15px_rgba(0,191,255,0.4)]">
            <i data-lucide="play" class="w-4 h-4 fill-white text-white ml-0.5"></i>
        </div>
        <h1 class="text-xl font-bold tracking-tight text-white hidden sm:block">Stream<span class="text-brand">View</span></h1>
    </a>

    <!-- Login Box -->
    <div class="glass-panel w-full max-w-md mx-4 rounded-3xl p-8 z-10 relative">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold mb-2">Bon retour</h2>
            <p class="text-gray-400 text-sm">Connectez-vous pour reprendre votre série.</p>
        </div>

        <form id="login-form" class="flex flex-col gap-4">
            <!-- Email Input -->
            <div class="relative group">
                <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500 group-focus-within:text-brand transition-colors"></i>
                <input type="email" id="login-email" placeholder="Adresse email" required
                    class="w-full bg-[#1A1A1A]/80 text-white rounded-xl py-4 pl-12 pr-4 text-[15px] font-medium outline-none focus:ring-2 focus:ring-brand focus:bg-[#222] transition-all border border-gray-800 focus:border-brand/30">
            </div>

            <!-- Password Input -->
            <div class="relative group">
                <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500 group-focus-within:text-brand transition-colors"></i>
                <input type="password" id="login-password" placeholder="Mot de passe" required
                    class="w-full bg-[#1A1A1A]/80 text-white rounded-xl py-4 pl-12 pr-12 text-[15px] font-medium outline-none focus:ring-2 focus:ring-brand focus:bg-[#222] transition-all border border-gray-800 focus:border-brand/30">
                <button type="button" onclick="togglePass('login-password', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-brand transition-colors">
                    <i data-lucide="eye" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Remember & Forgot -->
            <div class="flex justify-between items-center px-1">
                <label class="flex items-center gap-2 cursor-pointer group">
                    <input type="checkbox" class="w-4 h-4 rounded border-gray-600 text-brand focus:ring-brand accent-brand cursor-pointer">
                    <span class="text-xs text-gray-400 group-hover:text-gray-300 transition-colors">Se souvenir de moi</span>
                </label>
                <a href="#" class="text-xs text-brand hover:underline font-medium">Mot de passe oublié ?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-brand hover:bg-blue-400 text-black font-bold text-lg py-4 rounded-xl mt-4 transition-all transform hover:-translate-y-1 active:translate-y-0 shadow-[0_0_20px_rgba(0,191,255,0.3)]">
                Se connecter
            </button>
        </form>

        <div class="mt-8 text-center text-sm text-gray-400">
            Nouveau sur StreamView ? 
            <a href="signup.html" class="text-white font-bold hover:text-brand transition-colors ml-1">Créer un compte</a>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function togglePass(id, btn) {
            const input = document.getElementById(id);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('login-email').value;
            const allUsers = JSON.parse(localStorage.getItem('streamview_all_users')) || [];
            
            // Simuler une recherche (dans un vrai app, on vérifierait le mot de passe côté serveur)
            const user = allUsers.find(u => u.email === email);
            
            if (user) {
                // Connecter l'utilisateur
                localStorage.setItem('streamview_user', JSON.stringify({
                    ...user,
                    isLoggedIn: true
                }));
                window.location.href = 'preview.html';
            } else {
                alert('Aucun compte trouvé avec cet email. Veuillez vous inscrire.');
            }
        });
    </script>
</body>
</html>
